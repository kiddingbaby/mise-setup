[settings]
auto_update = true
auto_update_check_duration = "3d"
idiomatic_version_file_enable_tools = ["node", "java"]
java.shorthand_vendor = "temurin"
minimum_release_age = "3d"

lockfile = true
activate_aggressive = true
minimum_release_age_excludes = ["claude", "codex", "pi", "gemini"]

[tools]
chezmoi = "2.73.0"

node = "24.19.0"
go = "1.26.6"
java = "21.0.12+101.0.LTS"
python = "3.12.14"

uv = "0.12.23"

codex = "latest"
pi = "latest"
claude = "latest"
gemini = { version = "latest", allow_builds = ["@github/keytar", "node-pty"] }

cosign = "3.1.3"
crane = "0.22.1"
fzf = "0.74.4"
gitleaks = "8.30.1"
restic = "0.18.1"
direnv = "2.37.1"
yq = "4.53.6"
k9s = "0.51.0"
biome = "2.5.14"
gh = "2.102.0"
ffmpeg = "9.0.2"
ruff = "0.17.1"
ty = "0.0.89"
"npm:oxlint" = "1.87.0"
"npm:oxfmt" = "0.72.0"
golangci-lint = "2.12.2"
maven = "3.10.0"
gradle = "9.8.1"
rust = "1.99.1"
"go:golang.org/x/tools/gopls" = "0.23.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
helm = "3.21.3"
kubectl = "1.35.4"
kustomize = "5.7.1"
shellcheck = "0.9.0"
shfmt = "3.8.0"
just = "1.59.0"
actionlint = "1.7.12"
hadolint = "2.14.0"
pre-commit = "4.6.2"
"pipx:ansible-lint" = "26.10.1"
"pipx:yamllint" = "1.38.0"
"go:github.com/hashicorp/hcl/v2/cmd/hclfmt" = "2.24.0"

[dotfiles]
"~/.config/mise/config.toml" = { mode = "track" }

[bootstrap.services.mise-history]
builtin = "history-watch"

