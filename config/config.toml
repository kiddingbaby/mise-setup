[settings]
auto_update = true
auto_update_check_duration = "3d"
idiomatic_version_file_enable_tools = ["node", "java"]
java.shorthand_vendor = "temurin"
minimum_release_age = "3d"

lockfile = true
activate_aggressive = true
minimum_release_age_excludes = ["claude", "codex", "pi", "gemini"]

[tools]
chezmoi = "latest"

node = "24.19.0"
go = "1.26.6"
java = "21.0.12+101.0.LTS"
python = "3.12.14"

uv = "0.12.23"

codex = "latest"
pi = "latest"
claude = "latest"
gemini = { version = "latest", allow_builds = ["@github/keytar", "node-pty"] }

cosign = "3"
crane = "0.22"
fzf = "latest"
gitleaks = "8"
restic = "0.18"
direnv = "latest"
yq = "4"
k9s = "latest"
biome = "2.5.14"
gh = "latest"
ffmpeg = "latest"
ruff = "0.17.1"
ty = "0.0.89"
"npm:oxlint" = "1.87.0"
"npm:oxfmt" = "0.72.0"
golangci-lint = "2.12.2"
maven = "3.10.0"
gradle = "9.8.1"

[dotfiles]
"~/.config/mise/config.toml" = { mode = "track" }

[bootstrap.services.mise-history]
builtin = "history-watch"

